<body class="rsw-booting">

  <div id="rsw-boot" role="status" aria-live="polite" aria-label="Loading Roblox Studio Web">
    <div class="rsw-boot__aurora" aria-hidden="true"></div>
    <div class="rsw-boot__grid" aria-hidden="true"></div>
    <div class="rsw-boot__vignette" aria-hidden="true"></div>

    <div class="rsw-boot__panel">

      <div class="rsw-boot__stage-3d" aria-hidden="true">
        <div class="rsw-boot__orbit"></div>
        <div class="rsw-boot__cube">
          <span class="rsw-boot__face rsw-boot__face--front"></span>
          <span class="rsw-boot__face rsw-boot__face--back"></span>
          <span class="rsw-boot__face rsw-boot__face--right"></span>
          <span class="rsw-boot__face rsw-boot__face--left"></span>
          <span class="rsw-boot__face rsw-boot__face--top"></span>
          <span class="rsw-boot__face rsw-boot__face--bottom"></span>
        </div>
        <div class="rsw-boot__shadow"></div>
      </div>

      <p class="rsw-boot__wordmark">Roblox Studio Web</p>
      <p id="rsw-boot-title" class="rsw-boot__tagline">Preparing the engine</p>

      <div class="rsw-boot__rail">
        <div class="rsw-boot__rail-fill"></div>
      </div>

      <div class="rsw-boot__readout">
        <span id="rsw-boot-step" class="rsw-boot__step">Starting core services</span>
        <span id="rsw-boot-percent" class="rsw-boot__percent">0%</span>
      </div>

      <button id="rsw-boot-retry" class="rsw-boot__retry" type="button" hidden>Reload the page</button>
    </div>
  </div>

  <div id="app" aria-label="Roblox Studio Web"></div>

  <script type="module" src="./src/main.js"></script>
